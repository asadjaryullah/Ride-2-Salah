workflows:
  ios-testflight:
    name: Ride 2 Salah iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.ride2salah.mobile
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor native iOS project
        script: npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Kein submit_to_testflight: Das schickt den Build durch Apples
        # externe Beta-Pruefung - unnoetig fuer interne Tester, und Apple
        # laesst immer nur EINEN Build pro App gleichzeitig in dieser
        # Warteschlange zu. Interne Tester (App Store Connect Users)
        # bekommen neue Builds ohne jede Pruefung, sobald sie bei Apple
        # fertig verarbeitet sind - nur eben nicht automatisch einer
        # Gruppe zugewiesen, das macht man einmalig in App Store Connect.
